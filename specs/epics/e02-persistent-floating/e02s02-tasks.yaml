tasks:
  - id: t01
    description: >
      In Utils.kt performKeyAction(): add null-safety guard for
      `ime.currentInputConnection`. When InputConnection is null and
      persistent floating is active, route CommitText actions through
      sendDownUpKeyEvents() or currentInputConnection.sendKeyEvent()
      as KeyEvents instead of silently failing.
    verify: ./gradlew assembleDebug

  - id: t02
    description: >
      In Utils.kt: CommitText mapping — map ASCII text characters to
      Android KeyEvent.KEYCODE_* constants. Letters A-Z → KEYCODE_A..Z,
      digits 0-9 → KEYCODE_0..9, space → KEYCODE_SPACE, period →
      KEYCODE_PERIOD, comma → KEYCODE_COMMA, etc. Use
      KeyCharacterMap for reliable char-to-keycode conversion.
    verify: ./gradlew assembleDebug

  - id: t03
    description: >
      In Utils.kt: SendEvent (KeyEvent) actions already use
      sendKeyEvent() — verify these work when InputConnection is null.
      Add null-safe wrapper. Modifier chords (Ctrl/Alt/Meta + key) must
      compose and dispatch correctly when no text field is focused.
    verify: ./gradlew assembleDebug

  - id: t04
    description: >
      In Utils.kt: Navigation and control keys (Enter, Backspace, Tab,
      Esc, arrows, Page Up/Down, Home, End, Delete, F-keys) must dispatch
      as KeyEvents when InputConnection is null. Add null-safe path.
    verify: ./gradlew assembleDebug

  - id: t05
    description: >
      In Utils.kt: Toggle actions (Shift, Ctrl, Alt, Meta, CapsLock,
      Numeric, Emoji, Clipboard) must work when InputConnection is null.
      Mode toggles still affect keyboard state; modifier toggles still
      affect the activeModifiers bitmask. No InputConnection needed.
    verify: ./gradlew assembleDebug

  - id: t06
    description: >
