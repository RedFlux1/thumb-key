# specs/planning-context.yaml — written by elaborate-spec
feature_name: "revert-no-programmer-letters"
problem_statement: >
  The NOThumbKeyDataDriven layout had 27 programming symbols scattered onto
  letter key swipes (commit e783e48). All 27 symbols already exist on the
  standard NUMERIC_KEYBOARD. The letter keys should be reverted to their
  original clean state (letters only), the custom spacebar and return key
  customizations preserved, and the only missing action — Tab — added to
  the numeric layer (key 3, right swipe).
constraints:
  - "Do not modify NUMERIC_KEYBOARD globally — only NOThumbKeyDataDriven should reference a custom numeric layer"
  - "Keep custom spacebar (SPACEBAR_DATADRIVEN_KEY_ITEM) and return key (RETURN_DATADRIVEN_KEY_ITEM) as-is"
  - "Restore swipeType = TWO_WAY_HORIZONTAL on t key"
out_of_scope:
  - "NOThumbKeyDataDrivenExpanded layout"
  - "Any layout other than NOThumbKeyDataDriven"
key_decisions:
  - decision: "Revert NOThumbKeyDataDriven letter keys to pre-e783e48 state"
    rationale: "All programming symbols already exist on the numeric layer; duplicating them on letter keys clutters the layout and breaks muscle memory"
  - decision: "Add Tab to numeric layer key 3 right swipe"
    rationale: "Tab was the only non-symbol action added to letter keys that has no equivalent on the numeric layer. Key 3 right swipe is free and doesn't conflict with any letter key positions"
  - decision: "Create a custom numeric keyboard for NOThumbKeyDataDriven instead of modifying the shared NUMERIC_KEYBOARD"
    rationale: "Other layouts (>50) use NUMERIC_KEYBOARD; adding Tab globally would affect all of them"
