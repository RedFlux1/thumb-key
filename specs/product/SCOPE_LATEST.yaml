#
# Refined for persistent floating keyboard sub-mode.
# Previous scope (e01 floating keyboard, shipped) archived.

core_value: >
  Let users keep the floating Thumb-Key keyboard always visible so they can
  use it like a hardware keyboard — sending key events (arrows, modifiers,
  shortcuts) to websites and apps without needing a text field focused.

summary: >
  The current floating keyboard follows the IME focus lifecycle: it appears
  when a text field is focused and disappears when focus is lost. This
  prevents using the keyboard for hardware-style interactions like navigating
  web pages with arrow keys, hitting Ctrl+R to refresh, or using Tab to move
  between elements — all of which work fine on a physical keyboard but are
  impossible with the current IME because the keyboard hides the moment focus
  leaves a text field.

  This scope adds a "persistent" sub-mode of floating mode. When enabled,
  the floating keyboard stays visible regardless of text field focus. It is
  only dismissed manually by the user (fling-down on the drag handle). Key
  events (CommitText for letters/numbers, SendEvent for modifiers/shortcuts,
  and all other KeyActions) work the same whether or not a text field is
  focused — the IME sends events to the focused window like a hardware
  keyboard would.

  The feature is a sub-mode: floating mode must be enabled first, then
  persistent mode can be toggled. A visual indicator on the floating keyboard
  shows when persistent mode is active. When persistent is off, the floating
  keyboard behaves exactly as before (follows focus lifecycle).

in_scope:
  - name: "Persistent mode toggle"
    description: >
      A YAML keybinding (existing ToggleFloatingMode action, long-press or
      separate binding to toggle persistent) and a settings checkbox to
      enable persistent floating. Only visible/applicable when floating
      mode is active.
    maps_to: "e02s01"

  - name: "IME lifecycle independence"
    description: >
      When persistent is enabled, the floating overlay does not hide on
      onFinishInput() or onWindowHidden(). The IME stays alive via
      onEvaluateInputViewShown() returning true. Only a manual
      fling-down or explicit dismiss action hides the keyboard.
    maps_to: "e02s01"

  - name: "Hardware-keyboard-style input"
    description: >
      All key actions work without an InputConnection. Letter/number keys
      send KeyEvents (KEYCODE_A, etc.). Modifier chords (Ctrl+C, Ctrl+V,
      Alt+Tab) compose properly. Navigation keys (arrows, Tab, Esc, Page
      Up/Down) dispatch as KeyEvents to the focused window.
    maps_to: "e02s02"

  - name: "Visual persistent indicator"
    description: >
      A small visual element (lock icon, different drag handle color, or
      subtle border) on the floating keyboard that indicates persistent
      mode is active. Helps the user understand why the keyboard isn't
      auto-hiding.
    maps_to: "e02s01"

  - name: "Settings UI"
    description: >
      A "Keep keyboard visible" checkbox in the floating mode settings
      section. Only enabled when floating mode is on. Default: off.
      Persisted in Room DB as a new boolean field.
    maps_to: "e02s03"

out_of_scope:
  - item: "Auto-show on device unlock/boot"
    reason: >
      Not requested. The keyboard stays visible once opened, but the user
      must initially bring it up by focusing a text field or toggling the
      IME. Auto-show requires accessibility service or notification
      listener — significant complexity for marginal value.

  - item: "Per-app persistence"
    reason: >
      Same reasoning as floating mode — deferred. Global toggle covers the
      primary use case. Per-app settings add deny-list complexity.

  - item: "Auto-focus nearest text field on keypress"
    reason: >
      Not a hardware keyboard behavior. Hardware keyboards don't magically
      focus text fields — the user navigates to them with Tab or taps.
      Letter keys when nothing is focused send key events to the window
      (which may or may not handle them, same as a hardware keyboard).

  - item: "Persistent mode in docked (non-floating) keyboard"
    reason: >
      Persistent mode is a floating-only feature. The docked keyboard
      already has "Show on-screen keyboard" setting for always-visible
      behavior. Persistent floating is for the overlay use case.

  - item: "Customizable persistent indicator"
    reason: >
      Visual indicator is a fixed design element. No per-user theming or
      positioning of the indicator — it follows a standard placement.

  - item: "IME-aware key event injection (instrumenting other apps)"
    reason: >
      Key events are dispatched through the standard
      InputMethodService.sendDownUpKeyEvents() and
      currentInputConnection.sendKeyEvent() paths. When InputConnection
      is null, key events go to the focused window via dispatchKeyEvent().
      No accessibility service or instrumentation needed.

constraints:
  - "Must be a sub-mode of floating — floating must be enabled first"
  - "Floating keyboard with persistent=off must behave identically to current behavior (no regression)"
  - "Docked keyboard behavior unchanged by any persistent mode changes"
  - "Must not use accessibility service or system-level permissions"
  - "Android 8.0+ (API 26) — same as floating mode"
  - "No new external dependencies"
  - "All source files committed"
  - "Preflight green: ./gradlew lintKotlin lint assembleDebug"

success_criteria:
  - "With persistent enabled, floating keyboard stays visible after text field loses focus"
  - "Fling-down dismisses the keyboard (hides overlay AND IME)"
  - "Ctrl+letter shortcuts (e.g. Ctrl+R, Ctrl+T) work in a web browser without a text field focused"
  - "Arrow keys and Tab navigate web pages without a text field focused"
  - "Letter/number keys send KeyEvents when no InputConnection exists"
  - "With persistent disabled, floating keyboard hides on focus loss (unchanged behavior)"
  - "Docked keyboard behavior unchanged in all cases"
  - "Setting persists across app restart"
  - "Visual indicator shows/hides correctly when persistent is toggled"
  - "Preflight green: ./gradlew lintKotlin lint assembleDebug"

