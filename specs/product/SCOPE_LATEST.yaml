# specs/product/SCOPE_LATEST.yaml — written by scope-work (2026-08-03)
# Step 1 of the planning spine: scope-work → slice-tasks → plan-work
#
# Function key support for programmer keyboards.
# Previous scopes: e02 (persistent floating), e01 (floating keyboard), e00 (modifier support) — all shipped.

core_value: >
  Let users send function keys (F1–F12) from programmer keyboards by
  toggling a Fn modifier and pressing number keys — the same way Ctrl,
  Alt, and Meta modifiers already work.

summary: >
  Programmer keyboards (ENThumbKeyProgrammer, ENThumbKeyProgrammerExpanded,
  ENThumbKeyProgrammerWide, NOThumbKeyDataDriven, NOThumbKeyDataDrivenExpanded,
  etc.) need function keys for IDE shortcuts, terminal use (e.g., htop, mc),
  and debugging. Android lacks a dedicated Fn key, and the keyboard has no
  F-key row due to the 3×3/4×4 grid form factor.

  This feature adds a Fn modifier toggle, identical in UX to the existing
  Ctrl/Alt/Meta toggles:
  - Single tap activates Fn for the next keypress (one-shot)
  - Double-tap locks Fn (stays active until tapped again)
  - While Fn is active, number keys 1–9 send F1–F9, 0 sends F10,
    minus (-) sends F11, equals (=) sends F12
  - A "Fn" indicator appears in the modifier status line on the keyboard
  - Fn is only available on programmer/expanded keyboards (added to their
    layout definitions as a swipe action)

  F-keys are dispatched as KeyEvent(KEYCODE_F1..KEYCODE_F12), the same
  mechanism used by the existing SendEvent action, through the same
  performKeyAction path that handles modifier chords.

in_scope:
  - name: "Fn toggle toggle KeyAction"
    description: >
      Add ToggleFnMode(enable: Boolean) to the KeyAction sealed class,
      following the same pattern as ToggleCtrlMode/ToggleAltMode/ToggleMetaMode.
    maps_to: "e03s01"

  - name: "Fn bitmask state in KeyboardScreen"
    description: >
      Add FN_MODE_ON flag constant (0x20000), wire into activeModifiers
      bitmask with same tap/lock pattern (first=activate, second=lock,
      third=clear). Add onToggleFnMode callback lambda.
    maps_to: "e03s01"

  - name: "Digit-to-F-key mapping in performKeyAction"
    description: >
      When Fn modifier is active and CommitText contains a single digit
      (1-9,0) or minus/equals, send the corresponding F-key KeyEvent
      instead of the character. Map: 1→F1, ..., 9→F9, 0→F10, -→F11, =→F12.
      Works through the existing SendEvent path (sendDownUpKeyEvents or
      InputConnection.sendKeyEvent).
    maps_to: "e03s01"

  - name: "Modifier status indicator for Fn"
    description: >
      Extend the existing modifier status Text in KeyboardScreen to show
      "Fn" when the Fn bit is active, including the lock emoji (🔒) when
      locked. Append to the existing buildString block.
    maps_to: "e03s01"

  - name: "Shared Fn toggle KeyC in CommonKeys"
    description: >
      Add TOGGLE_FN_TRUE_KEYC and TOGGLE_FN_FALSE_KEYC to CommonKeys.kt,
      using Icons.Outlined.KeyboardFunctionKey (or a suitable fallback) as
      the display icon. Follow the same pattern as the Ctrl/Alt/Meta
      toggle key definitions.
    maps_to: "e03s02"

  - name: "Add Fn toggle to programmer keyboards"
    description: >
      Add the Fn toggle key (TOGGLE_FN_TRUE_KEYC on a swipe or tap) to
      each programmer/variant keyboard: ENThumbKeyProgrammer,
      ENThumbKeyProgrammerExpanded, ENThumbKeyProgrammerWide,
      NOThumbKeyDataDriven, NOThumbKeyDataDrivenExpanded,
      ENTypeSplitProgramming, ENSVThumbkeyProgrammer,
      CZProgrammerMessagEase. Place Fn on a free swipe direction of the
      same key that holds Ctrl/Alt, or on a dedicated key position.
    maps_to: "e03s02"

out_of_scope:
  - item: "Non-programmer keyboards"
    reason: >
      Fn is only useful in contexts where F-keys are needed (IDEs,
      terminals, debugging). Adding Fn to general-purpose keyboards
      adds complexity without value. Users who want it can add it
      via YAML key modifications.

  - item: "F13–F24 keys"
    reason: >
      Android KeyEvent supports up to KEYCODE_F24 but these keys are
      rarely used. Scope creep — can be added later if requested.

  - item: "Fn+other keys (beyond numbers and -/=)"
    reason: >
      The primary use case is F1–F12. Fn+letter combos (like some laptop
      keyboards) aren't standard on Android and would conflict with
      existing Ctrl/Alt/Meta chord behavior.

  - item: "Per-app Fn behavior or Fn remapping"
    reason: >
      No customization needed initially. Fn always maps digits to F-keys.
      The existing YAML key modification system can be extended later.

  - item: "Settings UI for Fn"
    reason: >
      Fn is a modifier like Ctrl/Alt/Meta — it doesn't need persistent
      settings. No Room DB schema changes needed.

constraints:
  - "Must follow the exact same tap/lock/clear UX as Ctrl, Alt, and Meta toggles"
  - "No new KeyboardMode — Fn is a modifier bit, like Ctrl/Alt/Meta"
  - "No changes to the KeyAction sealed class hierarchy that break exhaustive when branches"
  - "Must update ALL when branches in performKeyAction()"
  - "Must not regress existing modifier behavior (Ctrl/Alt/Meta chords still work)"
  - "F-keys dispatch via the same sendDownUpKeyEvents / sendKeyEvent paths"
  - "No new external dependencies"
  - "Preflight green: ./gradlew lintKotlin lint assembleDebug"

success_criteria:
  - "Single-tapping Fn + pressing 1 sends F1 (one-shot, Fn clears after)"
  - "Double-tapping Fn locks it; subsequent 1-9,0,-,= send F-keys until Fn tapped again"
  - "F1–F12 work in terminal apps (Termux) and browsers (Ctrl+F5 refresh, F12 devtools)"
  - "Fn indicator shows in modifier status line with lock emoji when locked"
  - "Ctrl/Alt/Meta chords still work correctly alongside Fn"
  - "Non-programmer keyboards unchanged (no Fn toggle visible)"
  - "Preflight green: ./gradlew lintKotlin lint assembleDebug"

references:
  - "../planning-context.yaml"
  - "../tech-architecture/tech-stack.md"
  - "../../key-modifications.yaml"
